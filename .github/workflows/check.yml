name: MoonBit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check / build / test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js (required by the js target)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, build and test
        run: |
          moon version --all
          moon check --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
      - name: Run the example
        run: moon run --target ${{ matrix.target }} examples/demo

  native:
    name: native build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, build and test
        run: |
          moon check --deny-warn --target native
          moon build --deny-warn --target native
          moon test --deny-warn --target native

  formatting:
    name: formatting and interface are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: moon fmt and moon info must not change the tree
        run: |
          moon fmt
          moon info
          git diff --exit-code
